<style>
:root{--bg:#f7f4ef;--paper:#fff;--ink:#1f2430;--muted:#646a78;--red:#d63a3a;--redsoft:#fbe3e1;--yellow:#fdf0c4;--blue:#dde9f7;--mint:#dcf2e2;--lilac:#ebe2f7;--good:#2f8a4c;--bad:#c8384f;--line:#e6ded2;--chip:#f1ece4;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding:16px max(14px,env(safe-area-inset-left)) 70px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
a.back{font-weight:800;color:var(--red);text-decoration:none}
.hero{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,7vw,40px);color:var(--red)}
.hero .sub{color:var(--muted);font-weight:800;margin:6px 0 0}
.clip{width:84px;height:auto;margin:0 auto 8px;display:block}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width .4s}
.ptext{font-weight:800;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
section.task{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 16px 20px;scroll-margin-top:60px}
section.task.done{border-color:var(--good)}
.head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.head .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-size:16px;display:grid;place-items:center}
.done .head .n{background:var(--good)}
.done .head .n::after{content:"✓"}.done .head .n span{display:none}
.head h2{font-size:clamp(17px,4.4vw,21px)}
.lead{color:var(--muted);font-weight:700;margin:0 0 14px}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fb{font-weight:800;min-height:1.4em}.ok{color:var(--good)}.no{color:var(--bad)}
input[type=text]{font:inherit;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--ink);min-width:0}
input.right{border-color:var(--good);background:var(--mint)}input.wrong{border-color:var(--bad);background:var(--redsoft)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* flashcards */
.card{perspective:1000px;margin:14px 0 10px;cursor:pointer;user-select:none}
.card .inner{position:relative;height:200px;transition:transform .5s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.face.front{background:var(--yellow)}.face.back{background:var(--blue);transform:rotateY(180deg)}
.face b{font-family:var(--display);font-size:clamp(24px,7vw,36px);line-height:1.15}
.face small{font-weight:800;color:var(--muted);margin-top:8px;font-size:16px}

.ctrl{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}

.wl div{padding:4px 0;border-bottom:1px solid var(--line)}
.wl .e{font-weight:800}
.wl .gh{grid-column:1/-1;font-family:var(--display);font-size:13px;color:var(--red);border:0;padding-top:10px}
/* quiz */
.qcount{font-weight:800;color:var(--muted);font-size:14px}
.qq{font-size:clamp(20px,5.4vw,26px);font-weight:800;margin:6px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qq.sent{font-size:clamp(17px,4.6vw,20px);font-weight:700}
.qq .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:800;text-align:left;min-height:52px}
.opt.right{background:var(--mint);border-color:var(--good)}.opt.wrong{background:var(--redsoft);border-color:var(--bad)}

.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 10px;font-weight:800;min-height:48px;text-align:center;font-size:16px}
.mi.sel{border-color:var(--ink);background:var(--yellow)}
.mi.got{background:var(--mint);border-color:var(--good);opacity:.55;cursor:default}
.mi.wrong{border-color:var(--bad);background:var(--redsoft)}
/* lists */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700}
.item .num{color:var(--red);font-weight:800}
.item input{width:150px}
.ru{color:var(--muted);font-weight:700;font-size:15px}
.past{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.past .cell{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 10px;font-weight:800}
.past .cell span{min-width:76px}
.past .cell input{width:100%}
.story{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px 14px;line-height:2.3;font-size:17px;font-weight:600}
.story input{width:118px;padding:0 6px;height:34px;line-height:1.2}
.story .bv{color:var(--muted);font-weight:800;font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}

/* scramble & builder */
.target{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}

.tile.w{font-size:17px}
.tile.used{visibility:hidden}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin:8px 0 12px}
.chain .link{background:var(--mint);border:2px solid var(--good);border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px}
.chain .arr{color:var(--red);font-weight:800}
.tf .item{justify-content:space-between;background:var(--bg);border-radius:14px;padding:10px 12px;border:2px solid transparent}
.tf .item.ok{border-color:var(--good)}
.tf .q{flex:1 1 220px}
.tf .bs{display:flex;gap:6px}
.tf .bs button{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:800}
.tf .bs button.right{background:var(--mint);border-color:var(--good)}
.tf .bs button.wrong{background:var(--redsoft);border-color:var(--bad)}
.listen .item{background:var(--bg);border-radius:14px;padding:8px 10px}
.listen .item input{flex:1 1 140px}
.final{text-align:center}
.final .big{font-family:var(--display);font-size:clamp(30px,9vw,46px);color:var(--red)}
.final input{width:100%;max-width:280px;text-align:center}
</style></head><body><div class="wrap">

<script>
/* ---------- DATA ---------- */
const W=[
{en:"buy",past:"bought",ru:"покупать",g:"verbs"},

{en:"in addition",ru:"кроме того",g:"text"},

{en:"incredible",ru:"невероятный",g:"text"},
{en:"achievement",ru:"достижение",g:"text"}];
const GROUPS=[["all","Все"],["verbs","Глаголы о деньгах"],["adj","Прилагательные"],["things","Предметы"],["text","Слова из текстов"]];

/* ---------- HELPERS ---------- */
const h=(tag,a={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="html")e.innerHTML=v;else e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;:]/g,"").replace(/\s+/g," ").trim();
const isRight=(v,a)=>a.split("|").some(x=>norm(x)===norm(v));
let voice=null;function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis"in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.88;speechSynthesis.speak(u)}
function shake(e){e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
const sayBtn=t=>h("button",{class:"say","aria-label":"Послушать",onclick:e=>{e.stopPropagation();say(t)}},"🔊");
let ERR=0;const DONE=new Set();let TOTAL=0;
function err(){ERR++;document.getElementById("pErr").textContent="Ошибок: "+ERR}
function upd(){document.getElementById("pDone").textContent=`Выполнено: ${DONE.size} из ${TOTAL}`;document.getElementById("barI").style.width=(DONE.size/TOTAL*100)+"%";const f=document.getElementById("finScore");if(f)f.textContent=`${DONE.size} / ${TOTAL}`}
const T=document.getElementById("tasks");let NUM=0;
function task(title,lead,build){const id="t"+(++NUM);const n=NUM;
 const s=h("section",{class:"task",id},h("div",{class:"head"},h("span",{class:"n"},h("span",{},String(n))),h("h2",{},title)),h("p",{class:"lead"},lead));
 const body=h("div");s.append(body);T.append(s);TOTAL++;
 build(body,()=>{if(DONE.has(id))return;DONE.add(id);s.classList.add("done");upd()});}
const fb=()=>h("div",{class:"fb"});
function good(el,msg){el.className="fb ok";el.textContent=msg||"Отлично! ✓"}
function bad(el,msg){el.className="fb no";el.textContent=msg}
const pick=(arr,n)=>shuffle(arr).slice(0,n);

/* generic: one-at-a-time quiz; wrong items come back at the end */
function quiz(body,items,done,{one=false,sentence=false}={}){
 let q=[...items],missed=new Set(),total=items.length,solved=0;
 const cnt=h("div",{class:"qcount"}),qq=h("div",{class:"qq"+(sentence?" sent":"")}),opts=h("div",{class:"opts"+(one?" one":"")}),f=fb();
 body.append(cnt,qq,opts,f);
 function show(){if(!q.length){cnt.textContent="";qq.textContent="";opts.innerHTML="";good(f,"Готово! Все ответы правильные ✓");done();return}
  const it=q[0];cnt.textContent=`Вопрос ${solved+1} из ${total}`;qq.innerHTML="";qq.append(h("span",{html:it.q}));if(it.say){qq.append(sayBtn(it.say))}
  f.textContent="";opts.innerHTML="";let wrongHere=false;
  shuffle(it.o).forEach(o=>{const b=h("button",{class:"opt",onclick:()=>{
   if(o===it.a){b.classList.add("right");if(it.sayAfter)say(it.sayAfter);[...opts.children].forEach(x=>x.disabled=true);
     setTimeout(()=>{q.shift();if(wrongHere&&!missed.has(it)){missed.add(it);q.push(it);total++}solved++;show()},650)}
   else{b.classList.add("wrong");b.disabled=true;shake(b);wrongHere=true;err()}}},o);opts.append(b)})}
 show()}

/* generic: tap-to-match in rounds */
function match(body,rounds,done,sayLeft=true){
 let r=0;const info=h("div",{class:"qcount"}),grid=h("div",{class:"match"}),f=fb();body.append(info,grid,f);
 function round(){const pairs=rounds[r];info.textContent=rounds.length>1?`Раунд ${r+1} из ${rounds.length}`:"";
  grid.innerHTML="";const L=h("div",{class:"col"}),R=h("div",{class:"col"});grid.append(L,R);let sel=null,left=pairs.length;
  shuffle(pairs).forEach(p=>{const b=h("button",{class:"mi",onclick:()=>{if(b.classList.contains("got"))return;L.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel={b,p};if(sayLeft)say(p[0])}},p[0]);L.append(b)});
  shuffle(pairs).forEach(p=>{const b=h("button",{class:"mi",onclick:()=>{if(b.classList.contains("got"))return;if(!sel){shake(b);return}
   if(sel.p===p){sel.b.classList.remove("sel");sel.b.classList.add("got");b.classList.add("got");sel=null;left--;
     if(!left){r++;if(r<rounds.length){good(f,"Раунд пройден!");setTimeout(()=>{f.textContent="";round()},700)}else{good(f,"Все пары найдены ✓");done()}}}
   else{b.classList.add("wrong");shake(b);err();setTimeout(()=>b.classList.remove("wrong"),500)}}},p[1]);R.append(b)});}
 round()}

/* generic: check typed inputs */
function checker(body,inputs,done,{bank}={}){
 let lvl=0;const f=fb();
 const row=h("div",{class:"row"},h("button",{class:"btn",onclick:check},"Проверить"),h("button",{class:"btn ghost",onclick:hint},"Подсказка"));
 body.append(row,f);
 inputs.forEach(i=>{i.addEventListener("keydown",e=>{if(e.key==="Enter")check()});i.addEventListener("input",()=>{i.classList.remove("right","wrong");if(bank)markBank()})});
 function markBank(){if(!bank)return;const vals=inputs.map(i=>norm(i.value));[...bank.children].forEach(s=>{const k=norm(s.textContent);s.classList.toggle("used",vals.includes(k))})}
 function check(){let ok=0;inputs.forEach(i=>{const r=isRight(i.value,i.dataset.a);i.classList.toggle("right",r);i.classList.toggle("wrong",!r&&i.value.trim()!=="");if(r){ok++;i.readOnly=true}});
  if(ok===inputs.length){good(f,"Всё верно! ✓");done()}else{bad(f,`Правильно: ${ok} из ${inputs.length}. Исправь красные и пустые поля.`);if(inputs.some(i=>i.classList.contains("wrong")))err()}}
 function hint(){lvl++;inputs.forEach(i=>{if(!isRight(i.value,i.dataset.a)){const a=i.dataset.a.split("|")[0];i.placeholder=a.slice(0,Math.min(lvl,a.length))+"…"}});bad(f,"Подсказка — первые буквы в пустых полях (сотри свой ответ, чтобы увидеть).")}
}
const inp=(a,w)=>{const i=h("input",{type:"text","data-a":a,autocomplete:"off",autocapitalize:"off",spellcheck:"false"});if(w)i.style.width=w;return i};

/* ---------- 1. FLASHCARDS ---------- */
task("New Words · Карточки","Нажми на карточку, чтобы перевернуть. 🔊 — послушать. Пролистай все 48 слов — и задание засчитается.",(body,done)=>{
 let list=W,i=0,ruFirst=false;const seen=new Set();
 const chips=h("div",{class:"chips"});const card=h("div",{class:"card"},h("div",{class:"inner"},h("div",{class:"face front"}),h("div",{class:"face back"})));
 const count=h("span",{class:"count"}),seenT=h("div",{class:"qcount",style:"text-align:center;margin-top:8px"});
 GROUPS.forEach(([k,l])=>chips.append(h("button",{class:"chip"+(k==="all"?" on":""),onclick:e=>{chips.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));e.target.classList.add("on");list=k==="all"?W:W.filter(w=>w.g===k);i=0;render()}},l)));
